name: "Terraform Plan"

# Runs `terraform plan` for each landing-zone environment on every PR that
# touches Terraform code, and posts the plan as a PR comment for review.
# Requires an Azure AD app registration with federated (OIDC) credentials
# trusting this repo, and the following repository/organization secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER
# Plus one *.tfvars file per environment supplied via repository variables
# or generated by a previous step (never commit real subscription IDs).

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: "true"

jobs:
  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [primary]
        # environment: [primary, dr] # Habilitar cuando DR esté configurado
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="use_azuread_auth=true"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --- PASO INYECTOR DE VARIABLES ---
      # Selects TFVARS_PRIMARY or TFVARS_DR based on the matrix environment,
      # so this works for both without duplicating steps once dr is enabled
      # in the matrix above.
      - name: Generate tfvars file
        env:
          RAW_TFVARS: ${{ matrix.environment == 'primary' && secrets.TFVARS_PRIMARY || secrets.TFVARS_DR }}
        run: |
          echo "$RAW_TFVARS" > "${{ matrix.environment }}.tfvars"

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color \
            -var-file="${{ matrix.environment }}.tfvars" \
            -out=tfplan | tee plan_output.txt
        continue-on-error: true
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      # --- LIMPIEZA AUTOMÁTICA DEL ARCHIVO TEMPORAL ---
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f *.tfvars

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/tfplan
          retention-days: 5

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'environments/${{ matrix.environment }}/plan_output.txt';
            let output = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan output produced.';
            if (output.length > 60000) {
              output = output.slice(0, 60000) + '\n... (truncated)';
            }
            const body = `#### Terraform Plan — \`${{ matrix.environment }}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
