name: "Terraform Apply"

# Applies Terraform changes for a landing-zone environment. Triggered
# manually so a human explicitly chooses *which* environment to roll out,
# and gated by a GitHub Environment (Settings > Environments) that can
# require reviewer approval before the job runs — this is the approval
# gate for production-affecting changes (primary / dr subscriptions).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Landing zone environment to apply"
        required: true
        type: choice
        options:
          - primary
          - dr

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  ARM_USE_OIDC: "true"

jobs:
  apply:
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # requires manual approval if configured
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color \
            -var-file="${{ inputs.environment }}.tfvars" \
            -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload state plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-applied-${{ inputs.environment }}-${{ github.run_id }}
          path: environments/${{ inputs.environment }}/tfplan
          retention-days: 30
